# Builds the Android agent APK. Download it from the run's artifacts and copy it to
# the server as Content/Android/SignalRemote-Agent.apk (for Docker: the folder mounted
# at /app/wwwroot/Content), so the Downloads page and the Android setup page serve it.
name: Android Agent

on:
  push:
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalRemote-Agent
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
